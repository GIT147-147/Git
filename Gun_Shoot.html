<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Shooting Game - Free Fire Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #1b1b2f 0%, #0f0f1a 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            padding: 0 4vw;
        }

        /* මාතෘකාව සැමවිටම උඩින්ම සහ වෙනත් කිසිම දෙයකට යට නොවී තිබීමට */
        .game-title {
            position: fixed;
            top: 2vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1.8rem, 3.5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffcc00 30%, #ff3333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 4px;
            filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.5));
            z-index: 999;
            border: 2px solid rgba(255, 204, 0, 0.3);
            padding: 5px 20px;
            border-radius: 50px;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            white-space: nowrap;
        }

        /* ඩිවයිස් එක කුඩා වුවද ලේඅවුට් එක මාරු නොවී වම්පස තුවක්කුව සහ දකුණුපස ඉලක්ක තබාගැනීම */
        .game-main-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            margin-top: 5vh;
            flex-wrap: nowrap;
        }

        /* වම් පැත්තේ තුවක්කුව සහ බටන් එක Container එක */
        .gun-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
            z-index: 10;
            flex-shrink: 0;
        }

        .gif-wrapper {
            /* මෙහි ප්‍රමාණය තවත් විශාල කරන ලදී */
            width: clamp(260px, 35vw, 500px);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: visible;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
        }

        .gun-gif {
            width: 100%;
            height: auto;
            display: block;
            transform-origin: center center;
        }

        @keyframes gunRecoil {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-22px, -8px) rotate(-12deg); }
            40% { transform: translate(-10px, -3px) rotate(-5deg); }
            70% { transform: translate(4px, 1px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .gun-recoil {
            animation: gunRecoil 0.3s ease-out;
        }

        .shoot-btn {
            padding: clamp(8px, 1.5vh, 15px) clamp(20px, 3vw, 40px);
            font-size: clamp(0.9rem, 1.5vw, 1.35rem);
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(135deg, #ff3333, #b30000);
            border: 2px solid #ffcc00;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .shoot-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.8);
            transform: translateY(-3px) scale(1.02);
        }

        .shoot-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .shoot-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* දකුණු පැත්තේ Target Container එක */
        .target-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: clamp(220px, 28vw, 380px);
            height: clamp(220px, 28vw, 380px);
            position: relative;
            z-index: 5;
            flex-shrink: 0;
        }

        .target-crosshair {
            position: absolute;
            width: clamp(35px, 4.5vw, 55px);
            height: clamp(35px, 4.5vw, 55px);
            border: 2px solid rgba(255, 51, 51, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 51, 51, 0.8), inset 0 0 6px rgba(255, 204, 0, 0.4);
            z-index: 6;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .target-crosshair::before,
        .target-crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 51, 51, 0.95);
        }

        .target-crosshair::before {
            top: -10px;
            bottom: -10px;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
        }

        .target-crosshair::after {
            left: -10px;
            right: -10px;
            top: 50%;
            height: 2px;
            transform: translateY(-50%);
        }

        .aim-dot {
            width: 6px;
            height: 6px;
            background-color: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffcc00;
            z-index: 8;
        }

        /* සබන් බෝල (Soap Bubble Style) ප්‍රමාණය ස්ක්‍රීන් එකට අනුව වෙනස් වීම */
        .target-ball {
            position: absolute;
            width: clamp(32px, 4vw, 50px);
            height: clamp(32px, 4vw, 50px);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(0, 243, 255, 0.3) 40%, rgba(138, 43, 226, 0.4) 70%, rgba(255, 0, 128, 0.5) 100%);
            color: #ffffff;
            font-weight: 900;
            font-size: clamp(0.85rem, 1.4vw, 1.3rem);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.9), 
                        inset 5px 5px 12px rgba(0, 243, 255, 0.6),
                        0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(2px);
            z-index: 4;
        }

        .target-ball::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 7px;
            width: 10px;
            height: 6px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            transform: rotate(-30deg);
            filter: blur(0.5px);
        }

        .hit-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,102,0,0.8) 40%, rgba(255,0,0,0) 70%);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2);
            transition: transform 0.1s ease-out, opacity 0.15s ease-out;
            pointer-events: none;
            z-index: 7;
        }

        .hit-effect.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.5);
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .popup-box {
            background: linear-gradient(145deg, #22223b, #11111d);
            padding: 30px 45px;
            border-radius: 16px;
            border: 2px solid #ffcc00;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4), 0 15px 40px rgba(0, 0, 0, 0.9);
            max-width: 90vw;
        }

        .popup-box h2 {
            margin-bottom: 15px;
            font-size: clamp(1.3rem, 2vw, 1.8rem);
            letter-spacing: 1.5px;
            color: #ffcc00;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .popup-box p {
            margin-bottom: 25px;
            font-size: clamp(1rem, 1.5vw, 1.35rem);
            color: #00ffcc;
            font-weight: 700;
        }

        .retry-btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 900;
            color: #000000;
            background: linear-gradient(135deg, #ffcc00, #e6b800);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .retry-btn:hover {
            background: linear-gradient(135deg, #ffe066, #ffcc00);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.7);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- මාතෘකාව සැමවිටම උඩින්ම පෙන්වයි -->
    <div class="game-title">Gun Shooting</div>

    <!-- ලේඅවුට් එක වෙනස් නොවන ප්‍රධාන Wrapper එක -->
    <div class="game-main-wrapper">
        <!-- වම් පැත්තේ තුවක්කුව සහ බටන් එක -->
        <div class="gun-container">
            <div class="gif-wrapper">
                <img id="gun" class="gun-gif" src="Gun.png" alt="Gun Image">
            </div>
            <button class="shoot-btn" id="shootBtn" onclick="shootGun()">Fire!</button>
        </div>

        <!-- දකුණු පැත්තේ Target Container -->
        <div class="target-container" id="targetArea">
            <div class="target-crosshair">
                <div class="aim-dot"></div>
            </div>
            <div id="hitEffect" class="hit-effect"></div>
        </div>
    </div>

    <!-- Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <h2 id="popupMessage">වෙඩි වැදුණි!</h2>
            <p id="giftMessage"></p>
            <button class="retry-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <!-- Audio File -->
    <audio id="gunSound" src="Gun_Shoot.mp3" preload="auto"></audio>

    <script>
        const gunImg = document.getElementById('gun');
        const hitEffect = document.getElementById('hitEffect');
        const gunSound = document.getElementById('gunSound');
        const targetArea = document.getElementById('targetArea');
        const popupOverlay = document.getElementById('popupOverlay');
        const popupMessage = document.getElementById('popupMessage');
        const giftMessage = document.getElementById('giftMessage');
        const shootBtn = document.getElementById('shootBtn');
        
        const balls = [];
        let forcedTarget = null;
        let ballInterval = null;

        const specialGifts = {
            1: "තෑග්ගක් නොමැත!",
            3: "තෑග්ගක් නොමැත!",
            4: "තෑග්ගක් නොමැත!",
            7: "තෑග්ගක් නොමැත!",
            2: "නොමිලේම නැවත උත්සාහ කරන්න 🔄",
            6: "ටොෆියක් 🍬",
            9: "පෑනක් 🖊️",
            10: "බ්‍රේස්ලට් එකක් 📿",
            5: "Teddy Bear 🧸",
            8: "Free Fire Super VIP Monthly Membership !"
        };

        function createTargetBalls() {
            for (let i = 1; i <= 10; i++) {
                const ball = document.createElement('div');
                ball.className = 'target-ball';
                ball.innerText = i;
                ball.dataset.number = i;

                if (i === 5 || i === 8) {
                    ball.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                } else if ([1, 3, 4, 7].includes(i)) {
                    ball.style.transition = 'transform 1.6s cubic-bezier(0.25, 1, 0.5, 1)';
                } else {
                    ball.style.transition = 'transform 0.9s cubic-bezier(0.25, 1, 0.5, 1)';
                }

                targetArea.appendChild(ball);
                balls.push(ball);
            }
            moveBalls();
        }

        function moveBalls() {
            const areaWidth = targetArea.clientWidth - 50;
            const areaHeight = targetArea.clientHeight - 50;

            balls.forEach(ball => {
                const ballNum = parseInt(ball.dataset.number);
                let randomX, randomY;

                if (ballNum === 5 || ballNum === 8) {
                    randomX = (Math.random() - 0.5) * areaWidth * 1.1;
                    randomY = (Math.random() - 0.5) * areaHeight * 1.1;
                } else if ([1, 3, 4, 7].includes(ballNum)) {
                    randomX = (Math.random() - 0.5) * (areaWidth * 0.45);
                    randomY = (Math.random() - 0.5) * (areaHeight * 0.45);
                } else {
                    randomX = (Math.random() - 0.5) * (areaWidth * 0.75);
                    randomY = (Math.random() - 0.5) * (areaHeight * 0.75);
                }

                ball.style.transform = `translate(${randomX}px, ${randomY}px)`;
            });
        }

        function startBallMovement() {
            clearInterval(ballInterval);
            moveBalls();
            ballInterval = setInterval(moveBalls, 900);
        }

        window.addEventListener('DOMContentLoaded', () => {
            createTargetBalls();
            startBallMovement();
            gunSound.load();
        });

        // Keydown event එක (Enter key එක සහ Ctrl + අංක සඳහා)
        window.addEventListener('keydown', (e) => {
            // Enter key එක එබූ විට වෙඩි තැබීමට (බටන් එක disable වී නොමැති නම් පමණි)
            if (e.key === 'Enter') {
                if (!shootBtn.disabled && !popupOverlay.classList.contains('show')) {
                    shootGun();
                }
            }

            if (e.ctrlKey) {
                let num = null;
                if (e.key >= '1' && e.key <= '9') {
                    num = parseInt(e.key);
                } else if (e.key === '0') {
                    num = 10;
                }

                if (num !== null) {
                    forcedTarget = num;
                }
            }
        });

        function shootGun() {
            shootBtn.disabled = true;

            gunImg.classList.remove('gun-recoil');
            void gunImg.offsetWidth; 
            gunImg.classList.add('gun-recoil');

            gunSound.currentTime = 0;
            gunSound.play().catch((error) => {
                console.log("Audio play blocked or failed: ", error);
            });

            setTimeout(checkHit, 200);
        }

        function checkHit() {
            let targetedBall = null;

            if (forcedTarget !== null) {
                targetedBall = balls.find(b => parseInt(b.dataset.number) === forcedTarget);
            }

            if (!targetedBall) {
                let minDistance = Infinity;
                balls.forEach(ball => {
                    const transform = window.getComputedStyle(ball).transform;
                    if (transform !== 'none') {
                        const matrix = new DOMMatrix(transform);
                        const distance = Math.hypot(matrix.m41, matrix.m42);
                        if (distance < minDistance) {
                            minDistance = distance;
                            targetedBall = ball;
                        }
                    }
                });
            }

            const ballNum = parseInt(targetedBall.dataset.number);
            let willHit = false;

            if (forcedTarget !== null) {
                willHit = true;
            } else {
                if (ballNum === 5 || ballNum === 8) {
                    willHit = Math.random() < 0.10;
                } else if ([1, 3, 4, 7].includes(ballNum)) {
                    willHit = Math.random() < 0.70;
                } else if ([2, 6, 9, 10].includes(ballNum)) {
                    willHit = Math.random() < 0.35;
                }
            }

            hitEffect.classList.add('active');

            setTimeout(() => {
                hitEffect.classList.remove('active');
            }, 180);

            clearInterval(ballInterval);

            setTimeout(() => {
                balls.forEach(ball => {
                    ball.style.display = 'none';
                });

                if (willHit) {
                    popupMessage.innerText = `අංක ${ballNum} වෙත වෙඩි වැදුණි! 🔥`;
                    giftMessage.style.color = "#00ffcc";
                    
                    if (specialGifts[ballNum]) {
                        giftMessage.innerText = specialGifts[ballNum];
                        if (specialGifts[ballNum].includes("නොමැත")) {
                            giftMessage.style.color = "#ff4d4d";
                        }
                    } else {
                        giftMessage.innerText = "මෙම ඉලක්කය සඳහා ත්‍යාග නැත!";
                        giftMessage.style.color = "#ff4d4d";
                    }
                } else {
                    popupMessage.innerText = `වෙඩි පහර මගහැරුණි! ❌`;
                    giftMessage.innerText = "නැවත උත්සාහ කරන්න!";
                    giftMessage.style.color = "#ff4d4d";
                }

                popupOverlay.classList.add('show');
            }, 400);
        }

        function resetGame() {
            popupOverlay.classList.remove('show');
            forcedTarget = null;
            shootBtn.disabled = false;

            balls.forEach(ball => {
                ball.style.display = 'flex';
            });

            startBallMovement();
        }
    </script>

</body>
</html>
